[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-xdr"
version = "1.0.0"
description = "Plataforma XDR ligera: detección y respuesta extendida para endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["psutil>=5.9", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sentinel-xdr = "xdr.cli:main"

[tool.setuptools.packages.find]
include = ["xdr*"]

[tool.setuptools.package-data]
xdr = ["data/*.json", "data/*.yaml", "data/rules/*.yaml", "server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
