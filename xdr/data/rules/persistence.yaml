- id: PERS-010
  title: Hook de gestor de paquetes creado
  severity: high
  tactic: persistence
  mitre: [T1546]
  category: persistence
  action: [created, modified]
  condition:
    all:
      - {field: mechanism, equals: package_hook}
      - {field: added_lines, regex: '(Pre|Post)-Invoke|DPkg::|APT::Update'}

- id: PERS-011
  title: Configuración de carga de módulos del kernel modificada
  severity: high
  tactic: persistence
  mitre: [T1547.006]
  category: persistence
  action: [created, modified]
  condition: {field: mechanism, equals: kernel_module}

- id: PERS-012
  title: Configuración de SSH debilitada
  severity: high
  tactic: persistence
  mitre: [T1098]
  category: persistence
  action: [created, modified]
  condition:
    all:
      - {field: mechanism, equals: ssh}
      - {field: added_lines, regex: '(?m)^\s*(PermitRootLogin\s+yes|PermitEmptyPasswords\s+yes|PasswordAuthentication\s+yes|AuthorizedKeysFile\s+\S+)'}

- id: PERS-013
