- id: PERS-001
  title: Tarea programada (cron/at) creada o modificada
  severity: medium
  tactic: persistence
  mitre: [T1053.003]
  category: persistence
  action: [created, modified]
  condition: {field: mechanism, in: [cron, at]}

- id: PERS-002
  title: Persistencia con comando malicioso (descarga, reverse shell u ofuscación)
  severity: critical
  tactic: persistence
  mitre: [T1053.003, T1543.002, T1546.004, T1105]
  category: persistence
  action: [created, modified, existing]
  condition:
    field: added_lines
    regex:
      - '(curl|wget)\s[^|\n]*\|\s*(ba|z|da)?sh'
      - '/dev/tcp/'
      - '\b(nc|ncat|netcat)\b.*\s-[a-z]*e\s'
      - 'base64\s+(-d|--decode)'
      - 'stratum\+tcp'
      - '(^|\s)/(tmp|dev/shm|var/tmp)/\.\S+'
      - 'python[23]?\s+-c\s+.*socket'
  response: [quarantine_file]

- id: PERS-003
  title: Servicio o timer systemd creado
  severity: medium
  tactic: persistence
  mitre: [T1543.002]
  category: persistence
  action: [created]
  condition: {field: mechanism, equals: systemd}

- id: PERS-004
  title: Claves SSH autorizadas modificadas
  severity: high
  tactic: persistence
  mitre: [T1098.004]
  category: persistence
  action: [created, modified]
  condition: {field: path, regex: 'authorized_keys2?$'}

- id: PERS-005
  title: /etc/ld.so.preload en uso (rootkit de usuario)
  severity: critical
  tactic: defense-evasion
  mitre: [T1574.006, T1014]
  category: persistence
  action: [created, modified, existing]
  condition:
    all:
      - {field: path, equals: /etc/ld.so.preload}
      - {field: content, regex: '\S'}
  response: [quarantine_file]

- id: PERS-006
  title: Perfil de shell modificado
  severity: medium
  tactic: persistence
  mitre: [T1546.004]
  category: persistence
  action: [created, modified]
  condition: {field: mechanism, equals: shell_profile}

- id: PERS-007
  title: Configuración sudoers modificada
  severity: high
